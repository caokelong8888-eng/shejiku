<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="p.trash.doc">回收站 — Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' fill='none' stroke='%231D1B18' stroke-width='2.5'/><rect x='10' y='10' width='12' height='12' fill='%231D1B18'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dash" data-page="trash">

  <aside class="dash-side" id="dashSide"></aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="dash-main">
    <header class="dash-top">
      <div class="crumb">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a href="dashboard.html" data-i18n="side.myspace">我的空间</a>
        <span class="sep">/</span>
        <span data-i18n="side.trash">回收站</span>
      </div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="语言切换 / Language">
          <button type="button" data-lang="zh" class="is-on">中文</button>
          <span class="sep"></span>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="page" id="pageRoot"></main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    var A = window.StudioApp, S = window.StudioStore;
    var root = A.qs('#pageRoot');

    var GROUPS = [
      { key: 'designs', kind: 'design', label: 'tr.designs' },
      { key: 'collections', kind: 'collection', label: 'tr.collections' },
      { key: 'projects', kind: 'project', label: 'tr.projects' },
      { key: 'files', kind: 'file', label: 'tr.files' },
      { key: 'folders', kind: 'folder', label: 'tr.folders' },
      { key: 'brands', kind: 'brand', label: 'tr.brand' },
      { key: 'websites', kind: 'website', label: 'tr.website' }
    ];

    function subtitle(kind, row) {
      if (kind === 'design') {
        var vs = (row.versions || []).filter(function (v) { return !v.deletedAt; }).length;
        var tags = (row.tagIds || []).length;
        return A.t('tr.versions', { n: vs }) + (tags ? ' · ' + tags + ' ' + A.t('side.tags') : '');
      }
      if (kind === 'collection') return A.t('tr.count', { n: (row.designIds || []).length });
      if (kind === 'project') return A.t('tr.count', { n: (row.designIds || []).length });
      if (kind === 'file') return S.kindLabel(row.kind, A.lang()) + ' · ' + A.prettySize(row.size);
      if (kind === 'folder') return '';
      if (kind === 'brand') return row.englishName || '';
      if (kind === 'website') return row.slug ? '/' + row.slug : '';
      return '';
    }

    function groupHTML(g, rows) {
      if (!rows.length) return '';
      return '<section class="tr-group" data-group="' + g.key + '">' +
        '<div class="tr-group-head"><h2>' + A.esc(A.t(g.label)) + '</h2>' +
          '<span>' + A.t('tr.count', { n: rows.length }) + '</span></div>' +
        rows.map(function (row) {
          return '<div class="tr-row" data-kind="' + g.kind + '" data-id="' + row.id + '">' +
            '<div class="tr-main">' +
              '<span class="tr-name">' + A.esc(row.name || row.originalName || '—') + '</span>' +
              '<span class="tr-sub">' + A.esc(subtitle(g.kind, row)) + '</span>' +
            '</div>' +
            '<span class="tr-time">' + A.esc(A.t('tr.deletedAt')) + ' ' + A.rel(row.deletedAt) + '</span>' +
            '<div class="tr-acts">' +
              '<button class="link-btn" type="button" data-restore="1">' + A.esc(A.t('tr.restore')) + '</button>' +
              '<button class="link-btn is-danger" type="button" data-purge="1">' + A.esc(A.t('tr.purge')) + '</button>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</section>';
    }

    function render() {
      var t = S.trashAll();
      var total = S.trashCount();

      root.innerHTML =
        '<div class="page-head">' +
          '<div>' +
            '<h1 data-i18n="p.trash.title">' + A.esc(A.t('p.trash.title')) + '</h1>' +
            '<p class="ph-sub">' + A.esc(A.t('p.trash.sub')) + '</p>' +
          '</div>' +
          '<div class="ph-actions">' +
            (total ? '<button class="btn btn-ghost btn-sm" id="trEmpty" type="button">' +
              '<span>' + A.esc(A.t('tr.emptyAll')) + '</span></button>' : '') +
          '</div>' +
        '</div>' +
        '<p class="tr-meta">' + A.esc(A.t('tr.onlyWs', { name: S.workspace.name })) +
          ' · ' + A.esc(A.t('tr.count', { n: total })) + '</p>' +
        (total
          ? GROUPS.map(function (g) { return groupHTML(g, t[g.key] || []); }).join('')
          : '<div class="empty-state"><div class="es-mark"></div>' +
            '<h2 class="es-title">' + A.esc(A.t('tr.empty')) + '</h2>' +
            '<p class="es-hint">' + A.esc(A.t('tr.emptyHint')) + '</p></div>');

      var emptyBtn = A.qs('#trEmpty');
      if (emptyBtn) emptyBtn.addEventListener('click', function () { confirmEmpty(total); });

      root.onclick = function (e) {
        var row = e.target.closest('.tr-row');
        if (!row) return;
        var kind = row.getAttribute('data-kind');
        var id = row.getAttribute('data-id');
        if (e.target.closest('[data-restore]')) { doRestore(kind, id, row.getAttribute('data-kind')); return; }
        if (e.target.closest('[data-purge]')) { confirmPurge(kind, id, row); }
      };
    }

    function doRestore(kind, id) {
      var res = S.restoreItem(kind, id);
      if (res && res.ok) {
        A.toast(A.t('tr.restored'));
        render();
        return;
      }
      var reason = res && res.reason;
      if (reason === 'conflict') A.toast(A.t('tr.conflict'));
      else A.toast(A.t('tr.restoreFailed'));
    }

    function confirmPurge(kind, id, row) {
      var name = (row.querySelector('.tr-name') || {}).textContent || '';
      A.confirm({
        title: A.t('tr.purgeTitle'),
        hint: A.t('tr.purgeHint', { name: name }),
        confirmLabel: A.t('tr.purge'), danger: true,
        onConfirm: function () {
          var res = S.purgeItem(kind, id);
          if (res.ok) { A.toast(A.t('tr.purged')); render(); return; }
          if (res.reason === 'in-use') {
            var n = (res.usage.designs || []).length + (res.usage.versions || []).length;
            A.toast(A.t('tr.inUse', { n: n }));
            return;
          }
          A.toast(A.t('tr.purgeFailed'));
        }
      });
    }

    function confirmEmpty(total) {
      A.confirm({
        title: A.t('tr.emptyAllTitle'),
        hint: A.t('tr.emptyAllHint', { n: total }),
        confirmLabel: A.t('tr.emptyAll'), danger: true,
        onConfirm: function () {
          var res = S.emptyAllTrash();
          if (res.skipped.length) {
            A.toast(A.t('tr.purgedN', { n: res.purged }) + ' · ' + A.t('tr.skipped', { n: res.skipped.length }));
          } else {
            A.toast(A.t('tr.purgedN', { n: res.purged }));
          }
          render();
        }
      });
    }

    A.page(render);
  })();
  </script>
</body>
</html>
