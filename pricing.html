<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="plan.doc">套餐 — Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' fill='none' stroke='%231D1B18' stroke-width='2.5'/><rect x='10' y='10' width='12' height='12' fill='%231D1B18'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dash" data-page="pricing">

  <aside class="dash-side" id="dashSide"></aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="dash-main">
    <header class="dash-top">
      <div class="crumb">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a href="dashboard.html" data-i18n="side.myspace">我的空间</a>
        <span class="sep">/</span>
        <span data-i18n="plan.title">套餐</span>
      </div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="语言切换 / Language">
          <button type="button" data-lang="zh" class="is-on">中文</button>
          <span class="sep"></span>
          <button type="button" data-lang="en">EN</button>
        </div>
        <a class="btn btn-ghost btn-sm" href="settings.html?tab=plan"><span data-i18n="set.usage">使用量</span><span class="arr"></span></a>
      </div>
    </header>

    <main class="page" id="planRoot"></main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    var A = window.StudioApp, S = window.StudioStore;
    var root = A.qs('#planRoot');

    function render() {
      var cur = S.plan();
      var summary = S.planSummary() || {};
      root.innerHTML =
        '<div class="page-head"><div><h1 data-i18n="plan.title">套餐</h1>' +
          '<p class="ph-sub" data-i18n="plan.sub">为个人设计师准备的三档方案。</p></div>' +
          '<div class="ph-actions">' + (cur
            ? '<span class="pill pill--done">' + A.esc(A.t('plan.current', { name: cur.name })) + '</span>'
            : '') + '</div></div>' +
        '<p class="plan-note">' + A.esc(A.t('plan.noPaymentsShort')) + '</p>' +
        '<div class="plan-grid" id="planGrid"></div>' +
        (summary.anyOverLimit ? '<p class="set-warn">' + A.esc(A.t('plan.overHint')) + '</p>' : '') +
        '<div class="plan-foot">' +
          '<button class="btn btn-sm" type="button" id="btnChange"><span>' + A.esc(A.t('plan.change')) + '</span><span class="arr"></span></button>' +
          '<a class="link-btn" href="settings.html?tab=plan">' + A.esc(A.t('set.usage')) + '</a>' +
        '</div>';

      StudioApi.plans().then(function (res) {
        var grid = A.qs('#planGrid');
        if (!grid) return;
        grid.innerHTML = res.plans.map(function (p) {
          var isCur = cur && cur.id === p.id;
          return '<div class="plan-card' + (isCur ? ' is-on' : '') + '">' +
            '<p class="pc-name">' + A.esc(p.name) + '</p>' +
            '<p class="pc-price">' + A.esc(p.priceNote) + '<i>' + A.esc(p.periodNote) + '</i></p>' +
            '<p class="pc-tag">' + A.esc(p.tagline) + '</p>' +
            '<ul class="pc-list">' + p.features.map(function (f) {
              return '<li>' + A.esc(f) + '</li>';
            }).join('') + '</ul>' +
            (isCur
              ? '<p class="pc-cur">' + A.esc(A.t('plan.inUse')) + '</p>'
              : '<button class="btn btn-ghost btn-sm" type="button" data-plan="' + p.id + '"><span>' +
                  A.esc(A.t('plan.choose')) + '</span></button>') +
          '</div>';
        }).join('');
        A.qsa('[data-plan]', grid).forEach(function (b) {
          b.addEventListener('click', function () { choosePlan(b.getAttribute('data-plan')); });
        });
        A.enter();
      }).catch(function (e) { A.toast(e && e.message || A.t('err.generic'), { error: true }); });

      var cb = A.qs('#btnChange');
      if (cb) cb.addEventListener('click', function () { A.openPlanModal(); });
      A.enter();
    }

    /* no money moves here — the server only allows this in the dev sandbox */
    function choosePlan(planId) {
      if (!S.devPlans()) {
        A.confirm({
          title: A.t('plan.title'), hint: A.t('plan.noPayments') + ' ' + A.t('plan.noPaymentsHint'),
          confirmLabel: A.t('act.close'),
          onConfirm: function () {}
        });
        return;
      }
      S.changePlan(planId).then(function (res) {
        A.toast(A.t('plan.changed', { name: res.summary.plan.name }));
        render();
      }).catch(function (e) { A.toast(e && e.message || A.t('err.generic'), { error: true }); });
    }

    A.page(render);
  })();
  </script>
</body>
</html>
