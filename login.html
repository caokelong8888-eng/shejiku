<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.doc">登录 — Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' fill='none' stroke='%231D1B18' stroke-width='2.5'/><rect x='10' y='10' width='12' height='12' fill='%231D1B18'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth" data-page="login">

  <div class="auth-wrap">
    <a class="auth-brand" href="index.html">
      <span class="logo-mark" aria-hidden="true"></span><span class="logo-type">Studio</span>
    </a>

    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="is-on" data-tab="login" data-i18n="auth.login">登录</button>
        <button type="button" data-tab="register" data-i18n="auth.register">注册</button>
      </div>

      <h1 class="auth-title" id="authTitle" data-i18n="auth.loginTitle">回到你的工作空间</h1>
      <p class="auth-sub" id="authSub" data-i18n="auth.loginSub">用邮箱登录，继续整理你的设计资产。</p>

      <form id="authForm" autocomplete="on">
        <div class="field" id="nameField" hidden>
          <label class="field-label" data-i18n="auth.name">名称</label>
          <input class="input" id="fName2" type="text" maxlength="40" placeholder="你的称呼" data-i18n-ph="auth.namePh">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="auth.email">邮箱</label>
          <input class="input" id="fEmail" type="email" autocomplete="email" placeholder="you@studio.com">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="auth.password">密码</label>
          <input class="input" id="fPass" type="password" autocomplete="current-password" placeholder="至少 8 位" data-i18n-ph="auth.passPh">
        </div>
        <div class="field" id="wsField" hidden>
          <label class="field-label" data-i18n="auth.firstWs">第一个工作区</label>
          <input class="input" id="fWs" type="text" maxlength="60" placeholder="我的工作室" data-i18n-ph="auth.firstWsPh">
          <p class="de-note" data-i18n="auth.firstWsNote">创建后可以随时增加更多工作区。</p>
        </div>

        <p class="auth-error" id="authError" hidden></p>

        <button class="btn auth-submit" type="submit" id="authSubmit">
          <span data-i18n="auth.login">登录</span><span class="arr"></span>
        </button>
      </form>

      <p class="auth-note" id="forgotLine">
        <button class="link-btn" type="button" id="forgotBtn" data-i18n="auth.forgot">忘记密码？</button>
      </p>
      <p class="auth-unsupported" id="forgotAnswer" hidden>
        <span data-i18n="auth.forgotUnsupported">暂不支持自助找回密码：当前没有接入邮件服务。</span>
      </p>

      <p class="auth-foot">
        <span data-i18n="auth.demoLabel">测试账号</span>
        <button class="link-btn" type="button" id="fillDemo">demo@dede.studio / dede2026</button>
      </p>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    var A = window.StudioApp, I = window.StudioI18n;
    var mode = 'login';
    var next = new URLSearchParams(location.search).get('next') || 'dashboard.html';

    /* already signed in? go straight back to where the user was headed */
    StudioApi.me().then(function () {
      location.href = next;
    }).catch(function () { /* stay on the login page */ });

    function paint() {
      A.qs('#nameField').hidden = mode !== 'register';
      A.qs('#wsField').hidden = mode !== 'register';
      A.qsa('.auth-tabs button').forEach(function (b) {
        b.classList.toggle('is-on', b.getAttribute('data-tab') === mode);
      });
      A.qs('#authTitle').setAttribute('data-i18n', mode === 'login' ? 'auth.loginTitle' : 'auth.registerTitle');
      A.qs('#authSub').setAttribute('data-i18n', mode === 'login' ? 'auth.loginSub' : 'auth.registerSub');
      A.qs('#authSubmit').firstElementChild.setAttribute('data-i18n', mode === 'login' ? 'auth.login' : 'auth.register');
      A.qs('#fPass').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
      I.apply(I.current(), document);
    }

    A.qsa('.auth-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        mode = b.getAttribute('data-tab');
        A.qs('#authError').hidden = true;
        paint();
      });
    });

    A.qs('#forgotBtn').addEventListener('click', function () {
      A.qs('#forgotAnswer').hidden = false;
    });
    A.qs('#fillDemo').addEventListener('click', function () {
      A.qs('#fEmail').value = 'demo@dede.studio';
      A.qs('#fPass').value = 'dede2026';
      mode = 'login';
      paint();
    });

    function showError(msg) {
      var el = A.qs('#authError');
      el.textContent = msg;
      el.hidden = false;
    }

    A.qs('#authForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = A.qs('#fEmail').value.trim();
      var pass = A.qs('#fPass').value;
      A.qs('#authError').hidden = true;
      var btn = A.qs('#authSubmit');
      btn.disabled = true;
      var done = function () { btn.disabled = false; };

      var go = function () { location.href = next; };

      if (mode === 'login') {
        StudioApi.login(email, pass).then(function () { go(); })
          .catch(function (err) { showError(err.message || A.t('err.generic')); done(); });
      } else {
        StudioApi.register({
          email: email, password: pass,
          name: A.qs('#fName2').value.trim(),
          workspaceName: A.qs('#fWs').value.trim()
        }).then(function () { go(); })
          .catch(function (err) { showError(err.message || A.t('err.generic')); done(); });
      }
    });

    paint();
    I.apply(I.current(), document);
  })();
  </script>
</body>
</html>
