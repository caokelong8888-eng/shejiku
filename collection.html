<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="p.collections.title">合集 — Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' fill='none' stroke='%231D1B18' stroke-width='2.5'/><rect x='10' y='10' width='12' height='12' fill='%231D1B18'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dash" data-page="collection">

  <aside class="dash-side" id="dashSide"></aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="dash-main">
    <header class="dash-top">
      <div class="crumb">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a href="dashboard.html" data-i18n="side.myspace">我的空间</a>
        <span class="sep">/</span>
        <a href="collections.html" data-i18n="p.collections.title">合集</a>
        <span class="sep">/</span>
        <span id="crumbName"></span>
      </div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="语言切换 / Language">
          <button type="button" data-lang="zh" class="is-on">中文</button>
          <span class="sep"></span>
          <button type="button" data-lang="en">EN</button>
        </div>
        <a class="btn btn-ghost btn-sm" href="index.html"><span data-i18n="top.viewsite">查看网站</span><span class="arr arr-up"></span></a>
      </div>
    </header>

    <main class="page" id="pageRoot"></main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    var A = window.StudioApp, S = window.StudioStore;
    var root = A.qs('#pageRoot');
    var cid = new URLSearchParams(location.search).get('id');
    var sortMode = 'manual';

    function getColl() { return S.collection(cid); }

    function designsFor(c, mode) {
      var list = S.designsByCollection(c.id);
      if (mode === 'recent') {
        list = list.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      } else if (mode === 'updated') {
        list = list.slice().sort(function (a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });
      }
      return list;
    }

    function render() {
      var c = getColl();
      if (!c) {
        root.innerHTML = '<div class="empty-state"><div class="es-mark"></div>' +
          '<h2 class="es-title">' + A.esc(A.t('cd.missing')) + '</h2>' +
          '<p class="es-hint">' + A.esc(A.t('cd.missingHint')) + '</p>' +
          '<div class="es-btn"><a class="btn" href="collections.html"><span>' + A.esc(A.t('act.back')) + '</span><span class="arr"></span></a></div></div>';
        return;
      }
      var name = S.name(c, A.lang());
      document.title = name + ' — Studio';
      var crumb = A.qs('#crumbName');
      if (crumb) crumb.textContent = name;

      var list = designsFor(c, sortMode);

      root.innerHTML =
        '<a class="detail-back" href="collections.html"><span class="arr"></span><span>' + A.esc(A.t('p.collections.title')) + '</span></a>' +
        '<div class="detail-hero">' +
          '<div>' +
            '<div class="detail-cover"><img src="' + A.img(c.cover) + '" alt=""></div>' +
            '<h1 class="detail-title">' + A.esc(name) + '</h1>' +
            '<p class="detail-desc">' + A.esc(S.desc(c, A.lang())) + '</p>' +
            '<div class="detail-actions">' +
              '<button class="btn btn-sm" id="btnEdit" type="button"><span>' + A.esc(A.t('act.edit')) + '</span></button>' +
              '<button class="btn btn-ghost btn-sm" id="btnAdd" type="button"><span>' + A.esc(A.t('act.addDesigns')) + '</span><span class="arr"></span></button>' +
              '<button class="btn btn-ghost btn-sm" id="btnMore" type="button"><span>' + A.esc(A.t('act.more')) + '</span></button>' +
            '</div>' +
          '</div>' +
          '<aside>' +
            '<div class="meta-block">' +
              '<p class="info-label">' + A.esc(A.t('meta.status')) + '</p>' +
              '<div style="margin-top:12px"><span class="pill pill--' + c.status + '">' + A.esc(S.collStatusLabel(c.status, A.lang())) + '</span></div>' +
              '<dl class="meta-rows">' +
                '<div class="meta-row"><dt>' + A.esc(A.t('meta.count')) + '</dt><dd>' + list.length + ' ' + A.esc(A.t('unit.designs')) + '</dd></div>' +
                '<div class="meta-row"><dt>' + A.esc(A.t('meta.created')) + '</dt><dd>' + A.date(c.createdAt) + '</dd></div>' +
                '<div class="meta-row"><dt>' + A.esc(A.t('meta.updated')) + '</dt><dd>' + A.rel(c.updatedAt) + '</dd></div>' +
              '</dl>' +
            '</div>' +
          '</aside>' +
        '</div>' +

        '<section class="detail-section">' +
          '<div class="ds-head">' +
            '<h2>' + A.esc(A.t('cd.designs')) + '<span class="ds-count">' + list.length + ' ' + A.esc(A.t('unit.designs')) + '</span></h2>' +
            '<div class="ds-tools">' +
              '<div class="sort-tabs" id="sortTabs">' +
                '<button type="button" data-sort="recent"' + (sortMode === 'recent' ? ' class="is-on"' : '') + '>' + A.esc(A.t('sort.recent')) + '</button>' +
                '<button type="button" data-sort="updated"' + (sortMode === 'updated' ? ' class="is-on"' : '') + '>' + A.esc(A.t('sort.updated')) + '</button>' +
                '<button type="button" data-sort="manual"' + (sortMode === 'manual' ? ' class="is-on"' : '') + '>' + A.esc(A.t('sort.manual')) + '</button>' +
              '</div>' +
              '<button class="btn btn-ghost btn-sm" id="btnAdd2" type="button"><span>' + A.esc(A.t('act.addDesigns')) + '</span><span class="arr"></span></button>' +
            '</div>' +
          '</div>' +
          (sortMode === 'manual' && list.length ? '<p class="sort-hint">' + A.esc(A.t('sort.hint')) + '</p>' : '') +
          '<div id="designArea" style="margin-top:26px"></div>' +
        '</section>';

      var area = A.qs('#designArea');
      if (!list.length) {
        area.innerHTML =
          '<div class="empty-state">' +
            '<div class="es-mark"></div>' +
            '<h2 class="es-title">' + A.esc(A.t('cd.empty')) + '</h2>' +
            '<p class="es-hint">' + A.esc(A.t('cd.emptyHint')) + '</p>' +
            '<div class="es-btn"><button class="btn" id="btnEmptyAdd" type="button">' +
              '<span>' + A.esc(A.t('act.addDesigns')) + '</span><span class="arr"></span></button></div>' +
          '</div>';
        var eb = A.qs('#btnEmptyAdd');
        if (eb) eb.addEventListener('click', addDesigns);
      } else {
        var grid = document.createElement('div');
        grid.className = 'design-grid';
        list.forEach(function (d) {
          grid.appendChild(A.designCard(d, {
            context: 'collection', collectionId: c.id,
            draggable: sortMode === 'manual',
            showAssoc: false,
            onChange: render
          }));
        });
        area.appendChild(grid);
        if (sortMode === 'manual') {
          A.enableDragSort(grid, function (ids) {
            S.setCollectionOrder(c.id, ids);
            A.toast(A.t('t.reordered'));
          });
        }
      }

      /* actions */
      A.qs('#btnEdit').addEventListener('click', function () {
        A.openCollectionModal({ existing: c, onSaved: function () { render(); } });
      });
      A.qs('#btnAdd').addEventListener('click', addDesigns);
      A.qs('#btnAdd2').addEventListener('click', addDesigns);
      A.qs('#btnMore').addEventListener('click', function (e) {
        e.stopPropagation();
        A.menu(e.currentTarget, [
          { label: c.status === 'public' ? S.collStatusLabel('draft', A.lang()) : S.collStatusLabel('public', A.lang()),
            onClick: function () {
              S.updateCollection(c.id, { status: c.status === 'public' ? 'draft' : 'public' });
              A.toast(A.t('t.saved')); render();
            } },
          { divider: true },
          { label: A.t('act.delete'), danger: true, onClick: function () {
              A.confirm({
                title: A.t('cf.deleteCollection'), hint: A.t('cf.deleteCollectionHint'),
                confirmLabel: A.t('act.delete'), danger: true,
                onConfirm: function () { S.deleteCollection(c.id); A.toast(A.t('t.deleted')); A.go('collections.html'); }
              });
            } }
        ]);
      });
      A.qs('#sortTabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-sort]');
        if (!b) return;
        sortMode = b.getAttribute('data-sort');
        render();
      });
    }

    function addDesigns() {
      var c = getColl();
      if (!c) return;
      A.pickDesigns({
        title: A.t('cd.pickTitle'),
        exclude: c.designIds,
        onDone: function (ids) {
          if (!ids.length) return;
          var n = S.addDesignsToCollection(c.id, ids);
          if (n) A.toast(A.t('t.addedDesigns', { n: n }));
          render();
        }
      });
    }

    A.page(render);
  })();
  </script>
</body>
</html>
